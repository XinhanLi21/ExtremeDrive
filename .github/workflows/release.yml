name: Build release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: extremedrive --assets assets verify
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/dev/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: extremedrive-release
          path: dist/*
