name: Build release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: extremedrive
          environment-file: environment.yml
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: extremedrive --assets assets verify
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/dev/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: extremedrive-release
          path: dist/*
