name: Build release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: extremedrive
          environment-file: environment.yml
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: extremedrive --assets assets verify
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/dev/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: extremedrive-release
          path: |
            dist/ExtremeDrive_Toolkit.zip
            dist/ExtremeDrive_Toolkit.zip.sha256
      - name: Keep only the latest toolkit download
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100
            });
            const releases = artifacts.filter(a => a.name === 'extremedrive-release')
              .sort((a, b) => b.id - a.id);
            for (const artifact of releases.slice(1)) {
              await github.rest.actions.deleteArtifact({
                ...context.repo, artifact_id: artifact.id
              });
            }
