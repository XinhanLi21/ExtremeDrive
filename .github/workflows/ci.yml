name: Toolkit CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: extremedrive --assets assets verify
      - run: python -m unittest discover -s tests -v
      - run: bash scripts/evaluation/run_smoke.sh
      - run: python scripts/dev/check_smoke.py
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-python-${{ matrix.python }}
          path: results/smoke/summary.json
