name: Toolkit CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: extremedrive
          environment-file: environment.yml
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: extremedrive --assets assets verify
      - run: python -m unittest discover -s tests -v
      - run: bash scripts/evaluation/run_smoke.sh
      - run: python scripts/dev/check_smoke.py
      - run: python -m build
