[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "extremedrive-toolkit"
version = "0.5.2"
description = "ExtremeDrive dataset API, planning submissions and vehicle-execution benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "scipy>=1.10,<2", "shapely>=2,<3", "matplotlib>=3.7", "pyquaternion>=0.9.9", "huggingface-hub>=0.26,<2"]
[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2"]
[project.scripts]
extremedrive = "extremebench.toolkit.cli:main"
[tool.setuptools.packages.find]
include = ["extremebench*"]
[tool.setuptools.package-data]
"extremebench._vendor" = ["manifest.json", "*_LICENSE"]
