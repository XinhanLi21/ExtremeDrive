<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExtremeDrive · 道路面逐场景校订</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c28;color:#e6eef6;font:14px system-ui}header{padding:14px 20px;border-bottom:1px solid #334659;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:21px;margin:0 0 6px}p{margin:5px 0;color:#9fb2c4}a{color:#7de0bd}button,select{background:#203447;border:1px solid #486075;color:#e5f1f8;padding:8px;border-radius:5px;cursor:pointer}button:hover{background:#36526a}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px}.views{display:grid;grid-template-columns:var(--camera,48%) 1fr;gap:12px;padding:0 18px;height:62vh;min-height:340px}.view{border:1px solid #33495c;background:#0b1420;position:relative;overflow:hidden;border-radius:8px}.label{position:absolute;top:10px;left:12px;background:#122332db;padding:6px 10px;border-radius:5px;z-index:1}#camera{width:100%;height:100%;object-fit:contain}canvas{width:100%;height:100%;touch-action:none}input[type=range]{accent-color:#68dec0}.playback{display:flex;gap:12px;align-items:center;padding:10px 18px}#timeline{flex:1}.notes{margin:0 18px 14px;padding:14px;background:#182c3d;border-radius:8px;line-height:1.7}.legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 18px 10px;font-size:13px}.sub{color:#a6b8c7;font-size:12px}#evidence{display:none;margin:14px auto;width:95%;max-width:1320px}.warn{color:#f4c779}@media(max-width:800px){.views{grid-template-columns:1fr;height:110vh}.bar{gap:7px}header{display:block}h1{font-size:18px}}
</style><header><div><h1>道路面 · 逐场景边界校订</h1><p>38 个完整测试场景 · 白线围合道路 · 分流与转弯按拓扑衔接</p></div><div><a href="../extremedrive_pi05_test_20261018/gallery/">原推理结果</a><p class="sub">独立区域图层 · 未覆盖原标线或历史评分</p></div></header>
<div class="bar"><button id="prev">上一场景</button><select id="scene"></select><button id="next">下一场景</button><select id="part"></select><button id="whole">整段地图</button><button id="follow">跟随自车</button><label>缩放 <input id="zoom" type="range" min="0.3" max="5" step=".1" value="1"></label><label>相机大小 <input id="split" type="range" min="25" max="70" value="48"></label></div>
<div class="legend"><label><input id="surface" type="checkbox" checked>绿色：重新划分的可行驶面</label><label><input id="marks" type="checkbox" checked>原白线 / 黄线</label><label><input id="actors" type="checkbox" checked>动态目标</label><label><input id="old" type="checkbox">红色：旧版评分区域（当前附近窗口）</label><span>蓝色：实车轨迹与 SL03 车身</span></div>
<div class="views"><div class="view"><div class="label" id="camlabel">原始前向图像</div><img id="camera"></div><div class="view"><div class="label" id="maplabel">BEV · 拖动平移，滚轮缩放</div><canvas id="map"></canvas></div></div>
<div class="playback"><button id="play">播放</button><button id="back">◀ 帧</button><input id="timeline" type="range" min="0" step="1" value="0"><button id="forward">帧 ▶</button><span id="time"></span></div>
<div class="notes"><strong id="note"></strong><div id="support"></div><div class="sub">校订方式：逐场景对照原图和已验收地图，选取边界链；断口沿同一边界插值，路口局部设置控制点。插值部分不是新观测。该图层为助手逐图校订草案，尚未计入用户验收。</div><button id="showEvidence">查看当前路段的图像与地图依据</button> <a id="download" download>下载本场景区域与边界记录</a></div><img id="evidence">
<script>
const $=id=>document.getElementById(id);let catalog=[],data=null,frame=0,mode='follow',center=[0,0],angle=0,scale=1,pan=[0,0],timer=null,oldCase=null,oldCatalog=[],requestId=0;const c=$('map'),ctx=c.getContext('2d');
function point(p){let x=p[0]-center[0],y=p[1]-center[1],co=Math.cos(angle),si=Math.sin(angle);return[c.width/2+(-x*si+y*co)*-scale+pan[0],c.height*.65-(x*co+y*si)*scale+pan[1]]}
function line(ps,col,width=1,close=false,fill=null){if(!ps.length)return;ctx.beginPath();ps.forEach((p,i)=>{let q=point(p);i?ctx.lineTo(...q):ctx.moveTo(...q)});if(close)ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=col;ctx.lineWidth=width;ctx.stroke()}
function geom(g,col,fill){if(!g)return;if(g.type==='GeometryCollection'){g.geometries.forEach(x=>geom(x,col,fill));return}if(g.type==='LineString'){line(g.coordinates,col,1);return}if(g.type==='MultiLineString'){g.coordinates.forEach(x=>line(x,col,1));return}let polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(let rings of polys){ctx.beginPath();for(let ring of rings){ring.forEach((p,i)=>{let q=point(p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath()}if(fill){ctx.fillStyle=fill;ctx.fill('evenodd')}ctx.strokeStyle=col;ctx.lineWidth=.8;ctx.stroke()}}
function draw(){if(!data)return;let r=c.getBoundingClientRect();if(c.width!==Math.round(r.width)||c.height!==Math.round(r.height)){c.width=Math.round(r.width);c.height=Math.round(r.height)}ctx.fillStyle='#0c1926';ctx.fillRect(0,0,c.width,c.height);let f=data.frames[frame];if(mode==='follow'){center=f.xy;angle=f.yaw;scale=c.height/85*+$('zoom').value}else{scale=baseScale*+$('zoom').value}if($('surface').checked)data.segments.forEach(s=>geom(s.geometry,'#68cca6','#245e4f'));if($('old').checked&&oldCase)geom(oldCase.road.drivable_area,'#ff8390','#f4597240');if($('marks').checked)data.features.forEach(f=>{let id=f.properties.class_id;if([1,2,8,9,100].includes(id))geom(f.geometry,id===8||id===9?'#ffdb57':id===100?'#f77683':'#edf5f7',null)});
// Draw each source episode separately: never fabricate a line across recording seams.
for(let s of data.segments){line(data.frames.filter(x=>x.key===s.source_key).map(x=>x.xy),'#3fbcf0',1)}
if($('actors').checked)for(let ob of f.objects)line(ob.xy,'#83d3fc',1,true,'#518eb42b');let co=Math.cos(f.yaw),si=Math.sin(f.yaw);let body=[[-2.41,-.945],[2.41,-.945],[2.41,.945],[-2.41,.945]].map(([x,y])=>[f.xy[0]+x*co-y*si,f.xy[1]+x*si+y*co]);line(body,'#62c9ff',2,true,'#3394d478');line([f.xy,[f.xy[0]+3*co,f.xy[1]+3*si]],'#86d7ff',2);ctx.fillStyle='#b3c6d2';ctx.font='12px system-ui';ctx.fillText('10 m',18,c.height-20);ctx.strokeStyle='#b3c6d2';ctx.beginPath();ctx.moveTo(18,c.height-12);ctx.lineTo(18+10*scale,c.height-12);ctx.stroke()}
let baseScale=1;
function fit(){mode='whole';pan=[0,0];$('zoom').value=1;angle=data.frames[0].yaw;let co=Math.cos(angle),si=Math.sin(angle),pts=data.segments.flatMap(s=>s.left_boundary.concat(s.right_boundary)),fwd=pts.map(p=>p[0]*co+p[1]*si),lat=pts.map(p=>-p[0]*si+p[1]*co);let mn=Math.min(...fwd),mx=Math.max(...fwd),ln=Math.min(...lat),lx=Math.max(...lat);let a=(mn+mx)/2,b=(ln+lx)/2;center=[a*co-b*si,a*si+b*co];baseScale=Math.min(c.width/(lx-ln+12),c.height*.7/(mx-mn+12));pan=[0,-c.height*.15];draw()}
async function updateOld(){let f=data.frames[frame],r=oldCatalog.filter(x=>x.scene_id===data.scene_id).sort((a,b)=>Math.abs(a.start_s-f.t)-Math.abs(b.start_s-f.t))[0];if(!r){oldCase=null;return}let stamp=++requestId;let d=await fetch('../extremedrive_pi05_test_20261018/gallery/'+r.file).then(r=>r.json());if(stamp!==requestId)return;oldCase=d;$('maplabel').textContent=$('old').checked?'旧面来自 '+r.start_s.toFixed(1)+'s 窗口；绿色为整段固定道路面':'BEV · 拖动平移，滚轮缩放';draw()}
function show(){let f=data.frames[frame],s=data.segments.find(s=>s.source_key===f.key);$('camera').src=f.image;$('time').textContent=f.t.toFixed(2)+' s / '+data.frames.at(-1).t.toFixed(2)+' s';$('camlabel').textContent='原始前向图像 · '+(frame+1)+' / '+data.frames.length;$('timeline').value=frame;$('part').value=s.source_key;$('note').textContent=s.note;$('support').textContent='边界链：左 '+s.left_feature_indices.length+' 条 / 右 '+s.right_feature_indices.length+' 条；缺口插值比例：左 '+(s.interpolation_fraction.left*100).toFixed(0)+'% / 右 '+(s.interpolation_fraction.right*100).toFixed(0)+'%。';$('evidence').src=s.evidence_image;draw();if($('old').checked&&!timer)updateOld()}
async function load(index){clearInterval(timer);timer=null;$('play').textContent='播放';let r=catalog[index];$('scene').value=index;data=await fetch(r.file).then(r=>r.json());frame=0;oldCase=null;pan=[0,0];mode='follow';$('zoom').value=1;$('timeline').max=data.frames.length-1;$('part').replaceChildren(...data.segments.map(s=>{let o=document.createElement('option');o.value=s.source_key;o.textContent=s.sections[0].t.toFixed(1)+'–'+s.sections.at(-1).t.toFixed(1)+' s';return o}));$('download').href=r.file;history.replaceState(null,'','#'+r.scene_id);show()}
$('scene').onchange=()=>load(+$('scene').value);$('prev').onclick=()=>load((+$('scene').value+catalog.length-1)%catalog.length);$('next').onclick=()=>load((+$('scene').value+1)%catalog.length);$('part').onchange=()=>{frame=data.frames.findIndex(f=>f.key===$('part').value);show()};$('timeline').oninput=e=>{frame=+e.target.value;show()};$('back').onclick=()=>{frame=Math.max(0,frame-1);show()};$('forward').onclick=()=>{frame=Math.min(data.frames.length-1,frame+1);show()};$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='播放'}else{$('play').textContent='暂停';timer=setInterval(()=>{frame++;if(frame>=data.frames.length){frame=data.frames.length-1;clearInterval(timer);timer=null;$('play').textContent='播放'}show()},250)}};$('whole').onclick=fit;$('follow').onclick=()=>{mode='follow';pan=[0,0];draw()};$('zoom').oninput=draw;$('split').oninput=e=>{document.documentElement.style.setProperty('--camera',e.target.value+'%');draw()};for(let id of ['surface','marks','actors'])$(id).onchange=draw;$('old').onchange=()=>{if($('old').checked)updateOld();else draw()};$('showEvidence').onclick=()=>{$('evidence').style.display=$('evidence').style.display==='block'?'none':'block'};
let drag=null;c.onpointerdown=e=>{drag=[e.clientX,e.clientY,...pan];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){pan=[drag[2]+e.clientX-drag[0],drag[3]+e.clientY-drag[1]];draw()}};c.onpointerup=()=>drag=null;c.onwheel=e=>{e.preventDefault();$('zoom').value=Math.max(.3,Math.min(5,+$('zoom').value*(e.deltaY>0?.9:1.1)));draw()};new ResizeObserver(draw).observe(c);
(async()=>{catalog=await fetch('catalog.json').then(r=>r.json());oldCatalog=await fetch('../extremedrive_pi05_test_20261018/gallery/catalog.json').then(r=>r.json());$('scene').replaceChildren(...catalog.map((r,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+' / '+catalog.length+' · '+r.scene_id;return o}));await load(Math.max(0,catalog.findIndex(r=>r.scene_id===location.hash.slice(1))))})().catch(e=>{$('note').textContent='加载失败：'+e.message;console.error(e)});
</script></html>
